name: publish

# Publish both packages to npm on a version tag (v0.5.0, …) with provenance, through npm trusted
# publishing (OIDC): no NPM_TOKEN secret is stored anywhere.
#
# Both packages already exist on npmjs.com (names reserved with 0.0.1), so trusted publishing is set up there once:
# npmjs.com → each package → Settings → Trusted publisher: GitHub Actions, repository vzroslieigry/maxagent,
# workflow file publish.yml, environment npm. Then: push the tag v<version> — maxagent and the bridge share it.
# Self-updating installs verify the provenance this workflow attaches, so only this workflow can ship an update.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      MAXAGENT_SKIP_PROBE: '1'
      MAXAGENT_REGISTRY: https://127.0.0.1:9
      MAXAGENT_NEWS_URL: https://127.0.0.1:9/news.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a recent npm CLI.
      - run: npm install -g npm@latest

      - name: tests before publishing
        run: |
          (cd packages/maxagent && node test/run.js && node test/hooks.js && node test/packs.js)
          (cd packages/maxagent-bridge && node test/run.js)
          node scripts/check-personal.js

      # One number for everything (owner's rule 08.11.2026): maxagent, maxagent-bridge and its extension.
      - name: the tag matches one version of maxagent, the bridge and the extension
        run: |
          v=$(node -p "require('./packages/maxagent/package.json').version")
          b=$(node -p "require('./packages/maxagent-bridge/package.json').version")
          e=$(node -p "require('./packages/maxagent-bridge/extension/manifest.json').version")
          test "$v" = "$b" && test "$v" = "$e" || { echo "versions differ: maxagent $v, bridge $b, extension $e"; exit 1; }
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, version $v"; exit 1; }

      # Re-running the workflow must not fail on what is already published.
      - name: maxagent-bridge
        working-directory: packages/maxagent-bridge
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "maxagent-bridge@$v" version >/dev/null 2>&1; then echo "maxagent-bridge@$v already published"; else npm publish --provenance --access public; fi

      - name: maxagent
        working-directory: packages/maxagent
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "maxagent@$v" version >/dev/null 2>&1; then echo "maxagent@$v already published"; else npm publish --provenance --access public; fi
