name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The packages are developed and checked on Windows first; Linux and macOS are informative until they pass.
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    env:
      MAXAGENT_SKIP_PROBE: '1'
      # Tests must never reach the network for update checks.
      MAXAGENT_REGISTRY: https://127.0.0.1:9
      MAXAGENT_NEWS_URL: https://127.0.0.1:9/news.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Meaning search (RAG) on every OS: the same pinned model and libraries as users get
      # (packages/maxagent/lib/extras.js). Cached by revision and versions.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: where the model lives
        shell: bash
        run: echo "MAXAGENT_VECTOR=$RUNNER_TEMP/vector" >> "$GITHUB_ENV"
      - id: vcache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vector
          key: vector-${{ runner.os }}-761b726-ort1.31.0-tok0.23.3
      - name: model and libraries (pinned, sha256)
        if: steps.vcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install -q --disable-pip-version-check --target "$MAXAGENT_VECTOR/py" onnxruntime==1.31.0 tokenizers==0.23.3
          python scripts/fetch-model.py "$MAXAGENT_VECTOR"
      - name: model self-test
        shell: bash
        run: python -B packages/maxagent/tools/experience-embed.py --self-test

      - name: maxagent — tests
        working-directory: packages/maxagent
        shell: bash
        run: |
          node test/run.js
          node test/hooks.js
          node test/packs.js

      - name: maxagent-bridge — tests
        working-directory: packages/maxagent-bridge
        run: node test/run.js

      - name: package contents
        shell: bash
        run: |
          (cd packages/maxagent && npm pack --dry-run)
          (cd packages/maxagent-bridge && npm pack --dry-run)

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: lint every pack source (format, secrets, one-word triggers)
        run: |
          set -e
          for d in packs/src/*/; do
            node packages/maxagent/tools/experience-engine.js lint --root "$d" --all
          done

      - name: planted commands in pack sources
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const { scan } = require("./packages/maxagent/tools/experience-packs.js");
            const walk = (d) => fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => e.isDirectory() ? walk(path.join(d, e.name)) : e.name.endsWith(".md") ? [path.join(d, e.name)] : []);
            let bad = 0;
            for (const f of walk("packs/src")) for (const h of scan(fs.readFileSync(f, "utf8"))) { console.log(`${f}:${h.line}: ${h.why}: ${h.text}`); bad++; }
            if (bad) process.exit(1); console.log("no risky text");
          '

      - name: nothing personal in the repository
        run: node scripts/check-personal.js

      - name: one version for maxagent, the bridge and its extension
        run: |
          node -e '
            const v = ["packages/maxagent/package.json", "packages/maxagent-bridge/package.json", "packages/maxagent-bridge/extension/manifest.json"].map((f) => require("./" + f).version);
            if (new Set(v).size !== 1) { console.log("versions differ:", v.join(" / ")); process.exit(1); }
            console.log("one version:", v[0]);
          '

      - name: catalog is valid JSON with checksums
        run: |
          node -e '
            const c = JSON.parse(require("fs").readFileSync("packs/catalog.json", "utf8"));
            for (const p of c.packs) if (!/^[a-z0-9-]+$/.test(p.name) || !/^[0-9a-f]{64}$/.test(p.sha256) || !(p.size > 0) || !p.url.startsWith("https://github.com/vzroslieigry/maxagent/releases/download/")) { console.log("bad entry", p.name); process.exit(1); }
            console.log(`catalog: ${c.packs.length} packs`);
          '
          node -e 'JSON.parse(require("fs").readFileSync("news.json","utf8")).items.length >= 0 || process.exit(1)'
