<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 380px; margin: 12px; color: #1d1d1f; background: #fff; }
  h2 { font-size: 13px; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .04em; color: #666; }
  .status { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c62828; }
  .dot.on { background: #2e7d32; }
  button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
  #stop.stopped { background: #c62828; color: #fff; border-color: #c62828; }
  #stop { margin-left: auto; }
  .agent { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .agent span { flex: 1; }
  textarea { width: 100%; height: 90px; font: 12px ui-monospace, monospace; box-sizing: border-box; }
  .log { max-height: 180px; overflow-y: auto; font: 12px ui-monospace, monospace; }
  .log div { padding: 2px 0; border-bottom: 1px solid #eee; }
  .bad { color: #c62828; }
  .muted { color: #777; }
</style>
</head>
<body>
<div class="status"><div id="dot" class="dot"></div><span id="host"></span><button id="stop"></button></div>
<h2 id="hAgents"></h2><div id="agents"></div>
<h2 id="hScripts"></h2><label class="agent"><input type="checkbox" id="scripts"><span id="scriptsText"></span></label><div id="scriptsWarn" class="bad"></div>
<h2 id="hBlock"></h2><textarea id="block"></textarea><button id="saveBlock"></button>
<h2 id="hLog"></h2><div id="log" class="log"></div>
<script src="popup.js"></script>
</body>
</html>
